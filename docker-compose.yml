# =============================================================================
#  Lab: Mô hình bảo mật CSDL nhiều lớp trên PostgreSQL
#  `docker compose up -d` dựng đủ: postgres, app, analyzer, dashboard, pgadmin.
#
#  Địa chỉ cố định trên dbnet (172.28.0.0/16) - cột `client` trong cảnh báo
#  chỉ thẳng ra tiến trình nào gửi câu lệnh:
#     .10 postgres   .20 app   .30 analyzer   .40 dashboard   .1 máy host
# =============================================================================

services:
  postgres:
    build: ./postgres
    image: secdb/postgres:16-pgaudit
    container_name: secdb-postgres
    restart: unless-stopped

    # Điểm mấu chốt: trỏ config_file ra ngoài $PGDATA.
    # docker-entrypoint.sh truyền nguyên các tham số này cho cả temp server
    # dùng khi chạy /docker-entrypoint-initdb.d/, nên pgaudit đã được preload
    # từ trước khi CREATE EXTENSION pgaudit được gọi.
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf

    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Mật khẩu các role nghiệp vụ, 02_roles.sh đọc từ đây
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
      READONLY_PASSWORD: ${READONLY_PASSWORD}
      ADMIN_PASSWORD:    ${ADMIN_PASSWORD}
      ANALYZER_PASSWORD: ${ANALYZER_PASSWORD}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}

    # LỚP 2 - khóa mã hóa.
    # Mount thành file ở /run/secrets/ bên trong container, KHÔNG thành biến
    # môi trường. Biến môi trường thì `docker inspect` đọc được; file secret
    # thì không. Database đọc khóa qua ext.master_key() (05_crypto.sql), nên
    # khóa không bao giờ đi qua dây mạng hay nằm trong bộ nhớ ứng dụng.
    secrets:
      - pgcrypto_key
      - cccd_pepper

    ports:
      # KHÔNG dùng 5432 ở phía host: máy dev có thể đã cài sẵn PostgreSQL native
      # (service postgresql-x64-NN nghe 0.0.0.0:5432). Khi đó Docker vẫn bind
      # thành công và `docker compose up` không báo lỗi gì, nhưng mọi kết nối
      # tới localhost:5432 lại rơi vào instance native - rất khó phát hiện vì
      # nó cũng là PostgreSQL và cũng trả lời bình thường.
      - "${POSTGRES_HOST_PORT:-15432}:5432"

    volumes:
      # PGDATA phải là NAMED VOLUME, không được bind-mount từ Windows:
      # initdb yêu cầu quyền 0700 trên thư mục data, bind-mount của Docker
      # Desktop không đáp ứng được và initdb sẽ thất bại.
      - pgdata:/var/lib/postgresql/data
      # WAL archive và backup thì ngược lại - phải nằm ngoài volume dữ liệu,
      # nếu không thì mất volume là mất luôn bản sao lưu.
      - ./backup/wal_archive:/backup/wal_archive
      - ./backup/full:/backup/full
      - ./logs:/var/log/postgresql

    networks:
      dbnet:
        ipv4_address: 172.28.0.10

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ---------------------------------------------------------------------------
  # LỚP 4 - hai container công cụ cho PITR, KHÔNG chạy cùng `docker compose up`
  # (profile `tools`). Script trong backup/scripts/ tự gọi chúng bằng
  # `docker compose run`.
  #
  # pitr-restore: gắn vào CHÍNH volume pgdata để dựng lại data directory từ
  #   base backup. Chỉ chạy khi service postgres đã dừng - pitr_restore.sh lo
  #   việc đó.
  # pitr-sandbox: volume RIÊNG, archive gắn read-only, không có mạng. Dùng để
  #   thử khôi phục mà không đụng tới database đang chạy (verify.sh gọi mỗi
  #   lần). Backup chưa từng restore thử thì chưa chắc đã là backup.
  # ---------------------------------------------------------------------------
  pitr-restore:
    image: secdb/postgres:16-pgaudit
    profiles: ["tools"]
    entrypoint: ["bash"]
    network_mode: none
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup/wal_archive:/backup/wal_archive:ro
      - ./backup/full:/backup/full

  pitr-sandbox:
    image: secdb/postgres:16-pgaudit
    profiles: ["tools"]
    entrypoint: ["bash"]
    network_mode: none
    volumes:
      - pitr_sandbox:/var/lib/postgresql/data
      - ./backup/wal_archive:/backup/wal_archive:ro
      - ./backup/full:/backup/full:ro

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: secdb-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8081:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - dbnet

  # ---------------------------------------------------------------------------
  # Ba tiến trình ứng dụng. Mỗi cái kết nối bằng ĐÚNG role của nó, cấu hình
  # truyền qua environment (không copy .env vào image - xem .dockerignore).
  # Cổng chỉ publish trên 127.0.0.1: app có 2 lỗ hổng cố ý, dashboard không có
  # đăng nhập - không được lộ ra mạng LAN.
  #
  # depends_on: service_healthy KHÔNG có nghĩa là init đã xong (CLAUDE.md "Bẫy
  # 7"). Cả ba đều tự thử kết nối lại, nên khởi động sớm chỉ thấy vài lỗi
  # kết nối đầu tiên rồi tự hết.
  # ---------------------------------------------------------------------------
  app:
    build: ./app
    image: secdb/app
    container_name: secdb-app
    restart: unless-stopped
    init: true
    environment:
      DB_HOST: 172.28.0.10
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: app_user
      DB_PASSWORD: ${APP_USER_PASSWORD}
      # Khoa ky cookie phien: Docker secret (file), KHONG phai bien moi truong.
      SESSION_SECRET_FILE: /run/secrets/session_secret
      PORT: 3000
      # Su kien bao mat tang web (do mat khau bi khoa, CSRF bi chan) - analyzer
      # doc thu muc nay (chi doc) va ghi canh bao. Xem app/src/securityLog.js.
      APP_LOG_DIR: /var/log/app
    secrets:
      - session_secret
    volumes:
      - ./logs/app:/var/log/app
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      dbnet:
        ipv4_address: 172.28.0.20

  analyzer:
    build: ./analyzer
    image: secdb/analyzer
    container_name: secdb-analyzer
    restart: unless-stopped
    # init: tiến trình init nhỏ làm PID 1, chuyển SIGTERM của `docker stop`
    # tới node để watch.js ghi nốt cảnh báo đang chờ rồi mới thoát.
    init: true
    # PostgreSQL ghi log với log_file_mode = 0640, chủ là postgres (uid/gid
    # 999). Analyzer chạy bằng user node (uid 1000) nên chỉ đọc được nhờ thêm
    # NHÓM 999 - đủ để đọc, không cần chạy bằng root hay giả làm uid postgres.
    group_add:
      - "999"
    environment:
      DB_HOST: 172.28.0.10
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: analyzer_user
      DB_PASSWORD: ${ANALYZER_PASSWORD}
      LOG_DIR: /logs
      # logs/app/ nam trong ./logs da mount CHI DOC o duoi.
      APP_LOG_DIR: /logs/app
      STATE_FILE: /state/analyzer-state.json
    volumes:
      # Log là BẰNG CHỨNG: mount chỉ đọc, analyzer bị chiếm cũng không sửa/xóa
      # được dấu vết. verify.sh có phép thử cho việc này.
      - ./logs:/logs:ro
      # Trạng thái dùng CHUNG với analyzer chạy trên host (cùng thư mục
      # analyzer/state/): chuyển qua lại giữa hai nơi không ghi trùng cảnh báo.
      - ./analyzer/state:/state
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      dbnet:
        ipv4_address: 172.28.0.30

  dashboard:
    build: ./dashboard
    image: secdb/dashboard
    container_name: secdb-dashboard
    restart: unless-stopped
    init: true
    environment:
      DB_HOST: 172.28.0.10
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: dashboard_user
      DB_PASSWORD: ${DASHBOARD_PASSWORD}
      POLL_INTERVAL_MS: 2000
      PORT: 4000
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      dbnet:
        ipv4_address: 172.28.0.40

secrets:
  # Sinh bằng: bash scripts/init-secrets.sh
  # Thư mục ./secrets/ nằm trong .gitignore - không bao giờ commit.
  pgcrypto_key:
    file: ./secrets/pgcrypto_key
  cccd_pepper:
    file: ./secrets/cccd_pepper
  session_secret:
    file: ./secrets/session_secret

volumes:
  pgdata:
  pgadmin_data:
  pitr_sandbox:

networks:
  dbnet:
    driver: bridge
    ipam:
      config:
        # Subnet cố định để pg_hba.conf tham chiếu được chính xác.
        # Nếu để Docker tự cấp phát, dải mạng đổi sau mỗi lần recreate và
        # luật host-based access control sẽ không còn khớp.
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
