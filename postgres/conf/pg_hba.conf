# =============================================================================
#  pg_hba.conf - LỚP 1a: Host-Based Access Control
#  Đây là hàng rào ĐẦU TIÊN, chạy trước cả GRANT/RLS: Postgres quyết định
#  "kết nối này có được phép thử xác thực hay không" trước khi xét quyền.
#
#  Quy tắc được duyệt TỪ TRÊN XUỐNG, dừng ở dòng khớp đầu tiên.
#  Mặc định của image official là `host all all all scram-sha-256`, tức là
#  ai chạm được cổng 5432 cũng có thể thử đăng nhập vào MỌI role, kể cả
#  superuser. File này siết lại.
#
#  Subnet 172.28.0.0/16 được cố định trong docker-compose.yml.
#  Kết nối từ máy host qua cổng publish 5432 sẽ vào bằng IP gateway 172.28.0.1.
# =============================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# --- Unix socket trong container -------------------------------------------
# Bắt buộc phải để `trust` cho postgres: docker-entrypoint.sh dùng socket này
# để chạy initdb và các script trong /docker-entrypoint-initdb.d/.
# Socket chỉ tồn tại bên trong container nên không phơi ra mạng.
local   all             postgres                                trust
local   all             all                                     scram-sha-256

# --- Superuser: KHÔNG bao giờ qua TCP ---------------------------------------
# Muốn dùng superuser thì phải vào được container:
#   docker compose exec postgres psql -U postgres -d secdb
# Kẻ tấn công chỉ có cổng 5432 sẽ không có đường nào chạm tới superuser.
host    all             postgres        all                     reject

# --- Các role nghiệp vụ: chỉ từ mạng của lab, bắt buộc SCRAM ----------------
host    all             app_user        172.28.0.0/16           scram-sha-256
host    all             readonly_user   172.28.0.0/16           scram-sha-256
host    all             admin_user      172.28.0.0/16           scram-sha-256
host    all             db_owner        172.28.0.0/16           scram-sha-256

# --- LỚP 3: bộ phân tích log ------------------------------------------------
# analyzer_user phải được khai báo ĐÍCH DANH ở đây mới kết nối được, y hệt mọi
# role khác. Đó chính là mô hình whitelist: thêm role mới ở 02_roles.sh thôi là
# chưa đủ - quên dòng này thì analyzer sẽ rơi vào luật reject cuối file.
host    all             analyzer_user   172.28.0.0/16           scram-sha-256

# --- Chốt chặn: mọi thứ còn lại bị từ chối ----------------------------------
# Khai báo tường minh thay vì dựa vào hành vi ngầm định, để `reject` trả về
# lỗi rõ ràng và để lại dấu vết trong log (khác với việc lặng lẽ rớt kết nối).
host    all             all             all                     reject
