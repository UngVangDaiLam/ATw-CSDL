# =============================================================================
#  postgresql.conf - Mô hình bảo mật CSDL nhiều lớp (lab)
#  Nạp bằng: postgres -c config_file=/etc/postgresql/postgresql.conf
#  Chỉ khai báo các tham số KHÁC mặc định; phần còn lại dùng default của PG16.
# =============================================================================

# -----------------------------------------------------------------------------
# FILE LOCATIONS
# Vì config_file nằm ngoài $PGDATA, Postgres sẽ mặc định tìm hba_file/ident_file
# cạnh config_file. Phải trỏ tường minh, nếu không server không khởi động được.
# -----------------------------------------------------------------------------
data_directory = '/var/lib/postgresql/data'
hba_file       = '/etc/postgresql/pg_hba.conf'
ident_file     = '/var/lib/postgresql/data/pg_ident.conf'

# -----------------------------------------------------------------------------
# LỚP 1a - KẾT NỐI & XÁC THỰC
# -----------------------------------------------------------------------------
listen_addresses    = '*'
port                = 5432
max_connections     = 100
password_encryption = scram-sha-256      # không dùng md5 (đã bị coi là yếu)

# -----------------------------------------------------------------------------
# TÀI NGUYÊN (quy mô lab)
# -----------------------------------------------------------------------------
shared_buffers       = 256MB
work_mem             = 8MB
maintenance_work_mem = 64MB

# -----------------------------------------------------------------------------
# LỚP 3 - GIÁM SÁT: pgAudit
# -----------------------------------------------------------------------------
shared_preload_libraries = 'pgaudit'

# read     = SELECT / COPY FROM
# write    = INSERT / UPDATE / DELETE / TRUNCATE / COPY TO
# role     = GRANT / REVOKE / CREATE ROLE / ALTER ROLE / DROP ROLE
# ddl      = toàn bộ DDL
# misc_set = các câu SET, trong đó có SET ROLE
#
# misc_set là BẮT BUỘC với kiến trúc ở đây, không phải tùy chọn:
# ứng dụng kết nối bằng app_user rồi SET ROLE nv_xxx cho từng request, nhưng
# cột `user` trong log luôn là SESSION USER (app_user) - SET ROLE không đổi
# được nó. Class `role` thì chỉ bắt GRANT/REVOKE/CREATE ROLE chứ không bắt
# SET ROLE. Thiếu misc_set, log chỉ thấy "app_user đọc bảng customers" và
# analyzer ở lớp 3 mất hoàn toàn khả năng quy trách nhiệm theo từng nhân viên.
# Có misc_set, analyzer bám theo pid của phiên: gặp SET ROLE nv_dn01 thì mọi
# câu lệnh sau đó trong phiên được quy cho nv_dn01.
pgaudit.log = 'read, write, role, ddl, misc_set'

# Ghi kèm tên bảng bị đụng tới trong từng câu lệnh -> analyzer biết được
# "ai vừa đọc bảng customers", chứ không chỉ biết "có người chạy SELECT".
pgaudit.log_relation = on

# TẮT có chủ đích: nếu bật, giá trị tham số (số CCCD, khóa truyền vào
# pgp_sym_encrypt, mật khẩu) sẽ bị ghi PLAINTEXT vào file log.
# Bật lên là phá vỡ toàn bộ lớp mã hóa ở lớp 2.
pgaudit.log_parameter = off

# Bỏ qua truy vấn vào catalog (pg_catalog / information_schema) - \d, \dx của psql
# và mọi ORM đều quét catalog liên tục, để on thì log ngập rác.
pgaudit.log_catalog = off

pgaudit.log_statement_once = off   # mỗi dòng AUDIT tự chứa câu lệnh -> dễ parse
pgaudit.log_level          = log

# -----------------------------------------------------------------------------
# LOGGING - nguồn dữ liệu cho analyzer ở bước 3
# -----------------------------------------------------------------------------
logging_collector = on
log_directory     = '/var/log/postgresql'    # bind-mount ra ./logs trên host
log_filename      = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode     = 0640
log_rotation_age  = 1d
log_rotation_size = 100MB

# csvlog: thỏa tiêu chí nghiệm thu của đồ án.
# jsonlog (PG15+): mỗi dòng là một JSON object -> analyzer chỉ cần JSON.parse.
# Cần cả hai vì câu SQL trong CSV có thể chứa dấu phẩy, dấu nháy và cả ký tự
# xuống dòng ngay trong trường "message", parser CSV tự viết rất dễ vỡ.
log_destination = 'csvlog,jsonlog'

# Với csvlog/jsonlog các trường đã tách sẵn thành cột, prefix này áp dụng cho
# stderr; vẫn khai báo để log không phụ thuộc định dạng.
# %m thời gian(ms) | %p pid | %u user | %d database | %a application_name | %h client IP
log_line_prefix = '%m [%p] user=%u db=%d app=%a client=%h '

# Rule "truy cập ngoài giờ hành chính" ở bước 3 so sánh theo giờ VN.
# Để mặc định UTC là lệch 7 tiếng -> cảnh báo sai toàn bộ.
log_timezone = 'Asia/Ho_Chi_Minh'
timezone     = 'Asia/Ho_Chi_Minh'

# Dữ liệu cho rule phát hiện brute-force / đăng nhập bất thường.
log_connections    = on
log_disconnections = on

# Phòng thủ nhiều lớp: nếu pgaudit vì lý do nào đó không nạp được,
# DDL vẫn còn dấu vết trong log.
log_statement = 'ddl'

log_min_duration_statement = 1000   # câu > 1s: nghi vấn quét/rút dữ liệu hàng loạt
log_min_messages           = warning
log_checkpoints            = on
log_lock_waits             = on

# -----------------------------------------------------------------------------
# LỚP 4 - WAL / ARCHIVE / PITR
# -----------------------------------------------------------------------------
wal_level       = replica            # đủ cho PITR + pg_basebackup
archive_mode    = on
archive_command = 'test ! -f /backup/wal_archive/%f && cp %p /backup/wal_archive/%f'

# Ép đóng segment mỗi 60s kể cả khi DB nhàn rỗi.
# Không có tham số này thì lượng WAL ít sẽ nằm mãi trong segment đang mở,
# và PITR chỉ khôi phục được tới thời điểm lần archive gần nhất.
archive_timeout = 60s

max_wal_senders = 3
wal_keep_size   = 256MB
full_page_writes = on
checkpoint_timeout = 5min
max_wal_size = 1GB
min_wal_size = 128MB
